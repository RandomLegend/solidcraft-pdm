# CI for gitlab.com: tests on Linux for every push. Release builds, automatically on the default
# branch and tags, by hand elsewhere (they take longer and use more compute minutes):
# - linux:appimage   SolidCraft-PDM-<version>-x86_64.AppImage
# - windows:build    solidcraft-pdm.exe and scpdm.exe (and the tests on Windows)

stages:
  - test
  - build

variables:
  RUST_VERSION: "1.93.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

linux:test:
  stage: test
  image: rust:1.93
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  cache:
    key: linux-$RUST_VERSION
    paths:
      - .cargo-home/registry/
      - target/
  script:
    - rustc --version
    - cargo test --workspace --locked

linux:appimage:
  stage: build
  image: rust:1.93-bookworm
  needs: ["linux:test"]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  cache:
    key: linux-release-$RUST_VERSION
    paths:
      - .cargo-home/registry/
      - target/
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
  script:
    # Built on Debian bookworm: the AppImage needs glibc 2.36 or newer (distributions from 2022 on).
    - packaging/linux/build-appimage.sh dist
  artifacts:
    name: solidcraft-pdm-linux-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/*.AppImage
    expire_in: 30 days

windows:build:
  stage: build
  needs: []
  tags:
    - saas-windows-medium-amd64
  variables:
    CARGO_HOME: $CI_PROJECT_DIR\.cargo-home
    RUSTUP_HOME: $CI_PROJECT_DIR\.rustup
  cache:
    key: windows-$RUST_VERSION
    paths:
      - .rustup/
      - .cargo-home/bin/
      - .cargo-home/registry/
      - target/
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
  before_script:
    # Rust is not preinstalled; the Visual Studio Build Tools (linker, C compiler for the
    # bundled SQLite) are.
    - $env:Path = "$env:CARGO_HOME\bin;$env:Path"
    - if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
        Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe;
        .\rustup-init.exe -y --no-modify-path --profile minimal --default-toolchain $env:RUST_VERSION;
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }
    - rustup default $env:RUST_VERSION
    - rustc --version
  script:
    - cargo build --release --locked -p scpdm-gui -p scpdm
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - cargo test --workspace --locked
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - New-Item -ItemType Directory -Force -Path dist | Out-Null
    - Copy-Item target\release\solidcraft-pdm.exe, target\release\scpdm.exe, README.md, docs\windows.md -Destination dist
  artifacts:
    name: solidcraft-pdm-windows-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/
    expire_in: 30 days
