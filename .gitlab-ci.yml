# CI for gitlab.com:
# - linux:test       the tests, on every push
# - linux:appimage   SolidCraft-PDM-<version>-x86_64.AppImage, automatically on the default
#                    branch when the push changes the app (see its rules), otherwise and on
#                    other branches by hand (kept 30 days)
# - windows:build    solidcraft-pdm.exe, scpdm.exe, the installer and the tests on Windows: only when
#                    started by hand (play button in the pipeline), since it takes long; the
#                    pipeline does not wait for it
#
# A tag vX.Y.Z (see "Releasing" in the README) makes a GitLab release:
# - release:check    the tag matches the version in Cargo.toml and CHANGELOG.md has its section
# - release:appimage the AppImage, the server for Linux (scpdm-server-<version>-x86_64-linux)
#                    and their SHA256SUMS (which the app's updates check), kept for good
# - release:docker   the server's Docker image: registry.gitlab.com/<project>/server:<version>
#                    and :latest
# - release          the release, with the changelog section as notes and the files as downloads

# A version commit ("Version 0.2.4") on a branch gets no pipeline: its release tag, pushed right
# after it, runs the whole pipeline for the same commit (tests included). Without this the commit
# would be tested twice; skipping it with ci.skip would leave an empty "skipped" pipeline.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_TITLE =~ /^Version \d+\.\d+\.\d+$/
      when: never
    - when: always

stages:
  - test
  - build
  - release

variables:
  RUST_VERSION: "1.93.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

linux:test:
  stage: test
  image: rust:1.93
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  cache:
    key: linux-$RUST_VERSION
    paths:
      - .cargo-home/registry/
      - target/
  script:
    - rustc --version
    - cargo test --workspace --locked

.appimage:
  stage: build
  # Built on Debian bookworm: the AppImage needs glibc 2.36 or newer (distributions from 2022 on).
  image: rust:1.93-bookworm
  needs: ["linux:test"]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  cache:
    key: linux-release-$RUST_VERSION
    paths:
      - .cargo-home/registry/
      - target/
  script:
    - packaging/linux/build-appimage.sh dist

linux:appimage:
  extends: .appimage
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # Built by itself only when the push changes what goes into the AppImage: the app, the
    # command line, the crates they use, packaging, dependencies. Otherwise (the server, docs):
    # by hand.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/scpdm-gui/**/*
        - apps/scpdm/**/*
        - crates/**/*
        - assets/**/*
        - packaging/linux/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
    - when: manual
      allow_failure: true
  artifacts:
    name: solidcraft-pdm-linux-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/*.AppImage
    expire_in: 30 days

release:check:
  stage: test
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
    - |
      if [ "$CI_COMMIT_TAG" != "v$version" ]; then
        echo "Tag $CI_COMMIT_TAG does not match the version in Cargo.toml ($version)."
        exit 1
      fi
    # The changelog section "## <version> …" up to the next "## ".
    - awk -v v="$version" 'index($0, "## " v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > release-notes.md
    - |
      if ! grep -q '[^[:space:]]' release-notes.md; then
        echo "CHANGELOG.md has no section for $version."
        exit 1
      fi
    - cat release-notes.md
  artifacts:
    paths:
      - release-notes.md

release:appimage:
  extends: .appimage
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: ["linux:test", "release:check"]
  script:
    - packaging/linux/build-appimage.sh dist
    - cargo build --release --locked -p scpdm-server
    - cp target/release/scpdm-server "dist/scpdm-server-${CI_COMMIT_TAG#v}-x86_64-linux"
    # The app checks what it downloads for an update against this.
    - (cd dist && sha256sum *.AppImage scpdm-server-* > SHA256SUMS && cat SHA256SUMS)
    - echo "APPIMAGE_JOB_ID=$CI_JOB_ID" > appimage.env
    - echo "APPIMAGE_FILE=$(basename dist/*.AppImage)" >> appimage.env
    - echo "SERVER_FILE=$(basename dist/scpdm-server-*)" >> appimage.env
  artifacts:
    name: solidcraft-pdm-linux-$CI_COMMIT_TAG
    paths:
      - dist/*.AppImage
      - dist/scpdm-server-*
      - dist/SHA256SUMS
    expire_in: never
    reports:
      dotenv: appimage.env

release:docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: ["linux:test", "release:check"]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - image="$CI_REGISTRY_IMAGE/server"
    - docker build -f packaging/docker/Dockerfile -t "$image:${CI_COMMIT_TAG#v}" -t "$image:latest" .
    - docker push "$image:${CI_COMMIT_TAG#v}"
    - docker push "$image:latest"

release:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - job: release:check
      artifacts: true
    # Its dotenv report (the AppImage's job and file) is an artifact: it must be passed.
    - job: release:appimage
      artifacts: true
    - job: release:docker
      artifacts: false
  script:
    - apk add --no-cache curl jq
    - |
      if [ -z "${APPIMAGE_JOB_ID:-}" ] || [ -z "${APPIMAGE_FILE:-}" ] || [ -z "${SERVER_FILE:-}" ]; then
        echo "release:appimage did not pass APPIMAGE_JOB_ID, APPIMAGE_FILE and SERVER_FILE."
        exit 1
      fi
    - files="$CI_PROJECT_URL/-/jobs/$APPIMAGE_JOB_ID/artifacts/raw/dist"
    - |
      jq -n --arg tag "$CI_COMMIT_TAG" --arg name "SolidCraft PDM ${CI_COMMIT_TAG#v}" \
        --rawfile notes release-notes.md --arg file "$APPIMAGE_FILE" --arg server "$SERVER_FILE" --arg files "$files" \
        '{tag_name: $tag, name: $name, description: $notes,
          assets: {links: [
            {name: $file, url: ($files + "/" + $file), link_type: "package", direct_asset_path: ("/" + $file)},
            {name: $server, url: ($files + "/" + $server), link_type: "package", direct_asset_path: ("/" + $server)},
            {name: "SHA256SUMS", url: ($files + "/SHA256SUMS"), link_type: "other", direct_asset_path: "/SHA256SUMS"}]}}' \
        > release.json
    - cat release.json
    - |
      curl --fail-with-body --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" --data @release.json \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"

windows:build:
  stage: build
  needs: []
  tags:
    - saas-windows-medium-amd64
  # Without a cache, installing Rust and building take about an hour.
  timeout: 2h
  variables:
    CARGO_HOME: $CI_PROJECT_DIR\.cargo-home
    RUSTUP_HOME: $CI_PROJECT_DIR\.rustup
  cache:
    key: windows-$RUST_VERSION
    # Also after a failure: the build is most of the hour.
    when: always
    paths:
      - .rustup/
      - .cargo-home/bin/
      - .cargo-home/registry/
      - target/
  rules:
    - when: manual
      allow_failure: true
  before_script:
    # Rust is not preinstalled; the Visual Studio Build Tools (linker, C compiler for the
    # bundled SQLite) are.
    - $env:Path = "$env:CARGO_HOME\bin;$env:Path"
    - if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
        Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe;
        .\rustup-init.exe -y --no-modify-path --profile minimal --default-toolchain $env:RUST_VERSION;
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }
    - rustup default $env:RUST_VERSION
    - rustc --version
  script:
    - cargo build --release --locked -p scpdm-gui -p scpdm
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    # Every failure at once, not only the first test file's.
    - cargo test --workspace --locked --no-fail-fast
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - New-Item -ItemType Directory -Force -Path dist | Out-Null
    - Copy-Item target\release\solidcraft-pdm.exe, target\release\scpdm.exe, README.md, docs\windows.md -Destination dist
    # The installer (Inno Setup 6, from Chocolatey, which the runner has).
    - choco install innosetup -y --no-progress
    - $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
    - '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\solidcraft-pdm.iss'
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    name: solidcraft-pdm-windows-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/
    expire_in: 30 days
