# CI (on the project's own runner, a Linux machine with Docker):
# - linux:test       the tests, on every push
# - linux:appimage   SolidCraft-PDM-<version>-x86_64.AppImage, by hand (kept 30 days); every
#                    release builds its own
# - windows:build    solidcraft-pdm.exe and scpdm.exe, built on Linux for Windows (MinGW), then
#   windows:installer  SolidCraft-PDM-<version>-setup.exe (Inno Setup in Wine): by hand on
#                    branches (kept 30 days)
#
# A tag vX.Y.Z (see "Releasing" in the README) makes a GitLab release:
# - release:check    the tag matches the version in Cargo.toml and CHANGELOG.md has its section
# - release:appimage the AppImage and the server for Linux (scpdm-server-<version>-x86_64-linux)
# - release:windows, release:installer   the Windows programs and their installer
# - release:docker   the server's Docker image: registry.gitlab.com/<project>/server:<version>
#                    and :latest
# - release:files    the downloads together, with their SHA256SUMS (which the app's updates
#                    check), kept for good
# - release          the release, with the changelog section as notes and the files as downloads
# - release:github   the same release on the GitHub mirror, with the files attached (only with
#                    GITHUB_TOKEN and GITHUB_REPO set, see the job)

# A version commit ("Version 0.2.4") on a branch gets no pipeline: its release tag, pushed right
# after it, runs the whole pipeline for the same commit. Without this the commit would be tested
# twice; skipping it with ci.skip would leave an empty "skipped" pipeline. The tag's tests are
# skipped in turn when the commit before passed on the default branch and the version commit
# changes nothing but the version, the changelog and docs (see linux:test).
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_TITLE =~ /^Version \d+\.\d+\.\d+$/
      when: never
    - when: always

stages:
  - test
  - build
  - release

variables:
  RUST_VERSION: "1.93.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

linux:test:
  stage: test
  image: rust:1.93
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  cache:
    key: linux-$RUST_VERSION
    paths:
      - .cargo-home/registry/
      - target/
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] && before="$(git rev-parse -q --verify HEAD~1)"; then
        # Only the version (Cargo.toml, Cargo.lock), CHANGELOG.md and docs/ changed?
        others="$(git diff --name-only HEAD~1 HEAD | grep -vE '^(Cargo\.toml|Cargo\.lock|CHANGELOG\.md|docs/)' || true)"
        manifest="$(git diff -U0 HEAD~1 HEAD -- Cargo.toml Cargo.lock | grep -E '^[+-][^+-]' | grep -vE '^[+-]version = ' || true)"
        passed="$(curl -sf "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines?sha=$before&ref=$CI_DEFAULT_BRANCH&status=success" || true)"
        if [ -z "$others" ] && [ -z "$manifest" ] && printf '%s' "$passed" | grep -q '"id"'; then
          echo "Tested already: $before passed on $CI_DEFAULT_BRANCH, and $CI_COMMIT_TAG only changes the version, changelog or docs."
          exit 0
        fi
      fi
    - rustc --version
    - cargo test --workspace --locked

.appimage:
  stage: build
  # Built on Debian bookworm: the AppImage needs glibc 2.36 or newer (distributions from 2022 on).
  image: rust:1.93-bookworm
  needs: ["linux:test"]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  cache:
    key: linux-release-$RUST_VERSION
    paths:
      - .cargo-home/registry/
      - target/
  script:
    - packaging/linux/build-appimage.sh dist

linux:appimage:
  extends: .appimage
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # By hand: a release builds its own (release:appimage), so building it on every push would
    # build the same app twice.
    - when: manual
      allow_failure: true
  artifacts:
    name: solidcraft-pdm-linux-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/*.AppImage
    expire_in: 30 days

release:check:
  stage: test
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
    - |
      if [ "$CI_COMMIT_TAG" != "v$version" ]; then
        echo "Tag $CI_COMMIT_TAG does not match the version in Cargo.toml ($version)."
        exit 1
      fi
    # The changelog section "## <version> …" up to the next "## ".
    - awk -v v="$version" 'index($0, "## " v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > release-notes.md
    - |
      if ! grep -q '[^[:space:]]' release-notes.md; then
        echo "CHANGELOG.md has no section for $version."
        exit 1
      fi
    - cat release-notes.md
  artifacts:
    paths:
      - release-notes.md

release:appimage:
  extends: .appimage
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: ["linux:test", "release:check"]
  script:
    - packaging/linux/build-appimage.sh dist
    - cargo build --release --locked -p scpdm-server
    - cp target/release/scpdm-server "dist/scpdm-server-${CI_COMMIT_TAG#v}-x86_64-linux"
  artifacts:
    name: solidcraft-pdm-linux-$CI_COMMIT_TAG
    paths:
      - dist/*.AppImage
      - dist/scpdm-server-*
    # release:files keeps them for good.
    expire_in: 1 week

# Built on Linux for Windows: MinGW (no Microsoft SDK needed); the programs need only DLLs
# every Windows has. The icon and version information come from build.rs (windres).
.windows:
  stage: build
  image: rust:1.93-bookworm
  needs: ["linux:test"]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  cache:
    key: windows-gnu-$RUST_VERSION
    paths:
      - .cargo-home/registry/
      - target/
  script:
    - apt-get update -qq && apt-get install -y -qq mingw-w64 > /dev/null
    - rustup target add x86_64-pc-windows-gnu
    - cargo build --release --locked --target x86_64-pc-windows-gnu -p scpdm-gui -p scpdm
    - mkdir -p dist/windows
    - cp target/x86_64-pc-windows-gnu/release/solidcraft-pdm.exe target/x86_64-pc-windows-gnu/release/scpdm.exe dist/windows/
    - x86_64-w64-mingw32-strip dist/windows/*.exe
    - ls -la dist/windows
  artifacts:
    name: solidcraft-pdm-windows-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/windows/
    expire_in: 1 week

# The installer, from the programs above: Inno Setup 6 in Wine (the image pinned by digest).
.installer:
  stage: build
  image:
    name: amake/innosetup@sha256:81713b854eb12278021045dcb57701fe35312030b2dc1d37710184f294a23f81
    entrypoint: [""]
  script:
    - version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
    - iscc "/DAppVersion=$version" '/DBinDir=..\..\dist\windows' packaging/windows/solidcraft-pdm.iss
    - ls -la dist/*-setup.exe
  artifacts:
    name: solidcraft-pdm-windows-installer-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/*-setup.exe
    expire_in: 1 week

windows:build:
  extends: .windows
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: manual
      allow_failure: true

windows:installer:
  extends: .installer
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  needs: ["windows:build"]

release:windows:
  extends: .windows
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: ["linux:test", "release:check"]

release:installer:
  extends: .installer
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: ["release:windows"]

# Every download in one place (the release links them here), with their checksums.
release:files:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - job: release:appimage
      artifacts: true
    - job: release:installer
      artifacts: true
  script:
    - rm -rf dist/windows
    # The app checks what it downloads for an update against this.
    - (cd dist && sha256sum *.AppImage scpdm-server-* *-setup.exe > SHA256SUMS && cat SHA256SUMS)
    - echo "FILES_JOB_ID=$CI_JOB_ID" > files.env
    - echo "APPIMAGE_FILE=$(basename dist/*.AppImage)" >> files.env
    - echo "SERVER_FILE=$(basename dist/scpdm-server-*)" >> files.env
    - echo "SETUP_FILE=$(basename dist/*-setup.exe)" >> files.env
  artifacts:
    name: solidcraft-pdm-$CI_COMMIT_TAG
    paths:
      - dist/*.AppImage
      - dist/scpdm-server-*
      - dist/*-setup.exe
      - dist/SHA256SUMS
    expire_in: never
    reports:
      dotenv: files.env

release:docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: ["linux:test", "release:check"]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - image="$CI_REGISTRY_IMAGE/server"
    - docker build -f packaging/docker/Dockerfile -t "$image:${CI_COMMIT_TAG#v}" -t "$image:latest" .
    - docker push "$image:${CI_COMMIT_TAG#v}"
    - docker push "$image:latest"

release:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - job: release:check
      artifacts: true
    # Its dotenv report (the files' job and names) is an artifact: it must be passed.
    - job: release:files
      artifacts: true
    - job: release:docker
      artifacts: false
  script:
    - apk add --no-cache curl jq
    - |
      if [ -z "${FILES_JOB_ID:-}" ] || [ -z "${APPIMAGE_FILE:-}" ] || [ -z "${SERVER_FILE:-}" ] || [ -z "${SETUP_FILE:-}" ]; then
        echo "release:files did not pass FILES_JOB_ID, APPIMAGE_FILE, SERVER_FILE and SETUP_FILE."
        exit 1
      fi
    - files="$CI_PROJECT_URL/-/jobs/$FILES_JOB_ID/artifacts/raw/dist"
    - |
      jq -n --arg tag "$CI_COMMIT_TAG" --arg name "SolidCraft PDM ${CI_COMMIT_TAG#v}" \
        --rawfile notes release-notes.md --arg file "$APPIMAGE_FILE" --arg server "$SERVER_FILE" --arg setup "$SETUP_FILE" --arg files "$files" \
        '{tag_name: $tag, name: $name, description: $notes,
          assets: {links: [
            {name: $file, url: ($files + "/" + $file), link_type: "package", direct_asset_path: ("/" + $file)},
            {name: $setup, url: ($files + "/" + $setup), link_type: "package", direct_asset_path: ("/" + $setup)},
            {name: $server, url: ($files + "/" + $server), link_type: "package", direct_asset_path: ("/" + $server)},
            {name: "SHA256SUMS", url: ($files + "/SHA256SUMS"), link_type: "other", direct_asset_path: "/SHA256SUMS"}]}}' \
        > release.json
    - cat release.json
    - |
      curl --fail-with-body --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" --data @release.json \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"

# The same release on GitHub, where GitLab mirrors the repository (push mirror: commits and tags,
# not releases). Needs two CI/CD variables, otherwise the job is left out: GITHUB_REPO (owner/name)
# and GITHUB_TOKEN (a token that may write that repository's contents; masked).
release:github:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $GITHUB_TOKEN && $GITHUB_REPO
  needs:
    - job: release:check
      artifacts: true
    - job: release:files
      artifacts: true
    - job: release
      artifacts: false
  # The GitLab release is the one the app updates from: GitHub failing doesn't fail the pipeline.
  allow_failure: true
  script:
    - apk add --no-cache github-cli
    - export GH_TOKEN="$GITHUB_TOKEN"
    # The mirror pushes the tag by itself, usually within minutes: wait for it (up to 15 minutes),
    # so the release is made for the mirrored tag and gh doesn't create one of its own.
    - |
      for i in $(seq 1 30); do
        gh api "repos/$GITHUB_REPO/git/ref/tags/$CI_COMMIT_TAG" > /dev/null 2>&1 && break
        echo "Waiting for $CI_COMMIT_TAG on GitHub..."
        sleep 30
      done
    - files="$(ls dist/*.AppImage dist/scpdm-server-* dist/*-setup.exe dist/SHA256SUMS)"
    # Run again (retry), it replaces the files of the release it made before.
    - |
      if gh release view "$CI_COMMIT_TAG" --repo "$GITHUB_REPO" > /dev/null 2>&1; then
        gh release upload "$CI_COMMIT_TAG" --repo "$GITHUB_REPO" --clobber $files
      else
        gh release create "$CI_COMMIT_TAG" --repo "$GITHUB_REPO" --verify-tag \
          --title "SolidCraft PDM ${CI_COMMIT_TAG#v}" --notes-file release-notes.md $files
      fi
