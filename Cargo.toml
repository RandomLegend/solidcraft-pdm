[workspace]
resolver = "3"
members = ["crates/scformat", "crates/vault", "crates/protocol", "crates/remote", "apps/scpdm", "apps/scpdm-gui", "apps/scpdm-server"]

[workspace.package]
version = "0.2.6"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
scformat = { path = "crates/scformat" }
vault = { path = "crates/vault" }
protocol = { path = "crates/protocol" }
remote = { path = "crates/remote" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
dunce = "1"
clap = { version = "4", features = ["derive", "env"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_extras = { version = "0.35", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"
nucleo-matcher = "0.3"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
argon2 = "0.5"
rand = "0.9"
ureq = { version = "3", features = ["json"] }
rpassword = "7"
anyhow = "1"
egui_kittest = { version = "0.35", features = ["eframe", "wgpu", "snapshot"] }

# Keep builds small: full debug info only for our own crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
