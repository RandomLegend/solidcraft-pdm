# The SolidCraft PDM server with Docker Compose (see docs/server.md):
#
#   docker compose up -d
#   docker compose exec pdm scpdm-server user add root --admin
#
# Backups (daily by default; schedule and how many to keep on the administration page) go to
# the volume pdm-backups. Better on another disk or a share: set PDM_BACKUPS to a folder there
# (it must be writable for the user id 7380: `chown 7380 /mnt/nas/pdm`), or make pdm-backups
# an SMB or NFS volume (see the end of this file).
#
# HTTPS (optional): set PDM_DOMAIN to the server's name (it must reach this machine on ports
# 80 and 443, for the certificate) and start with the "https" profile:
#
#   PDM_DOMAIN=pdm.example.com docker compose --profile https up -d

services:
  pdm:
    image: registry.gitlab.com/randomlegend/solidcraft-pdm/server:${PDM_VERSION:-latest}
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    restart: unless-stopped
    environment:
      SCPDM_SERVER_NAME: ${PDM_NAME:-SolidCraft PDM}
    ports:
      - "${PDM_PORT:-7380}:7380"
    volumes:
      - pdm-data:/data
      - ${PDM_BACKUPS:-pdm-backups}:/backups

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${PDM_DOMAIN:-set-PDM_DOMAIN} --to pdm:7380
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - pdm

volumes:
  pdm-data:
  caddy-data:
  pdm-backups:
  # On a share instead, for example:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     device: //nas.lan/backups/pdm
  #     o: username=pdm,password=secret,uid=7380,gid=7380,vers=3.0
  # or NFS:
  #     type: nfs
  #     device: :/export/backups/pdm
  #     o: addr=nas.lan,rw,nfsvers=4
